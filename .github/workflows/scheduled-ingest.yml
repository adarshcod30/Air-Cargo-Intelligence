name: Scheduled ingest

# SRS NFR-3: new data reflected within 24 hours of publication.
#
# Runs once a day rather than hourly: these publishers release monthly,
# and the sources rate-limit. Crawling them more often would add load
# without adding freshness.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    # A second run must not start while one is in flight. Two concurrent
    # crawls is exactly how this project got rate limited.
    concurrency:
      group: scheduled-ingest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      # Fail here, not four minutes later. Without this the job crawls the
      # publishers first and only discovers it has nowhere to write when the
      # load stage opens a connection, so the log reads as a pipeline fault
      # rather than a missing secret.
      - name: Check the secrets this job needs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set as a repository secret."
            echo "Set it with: gh secret set DATABASE_URL"
            echo "Without it the crawl runs and then discards everything it fetched."
            exit 1
          fi

      - name: Run the pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          # Narration and the retrieval index run through Bedrock. Without
          # these the run still succeeds, but the insight agent falls back
          # to templated prose and the difference is invisible in the
          # output, so the site would quietly get worse rather than break.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          BEDROCK_ENABLED: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: python -m services.scheduler
      - name: Publish the run state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: data/processed/pipeline_state.json
          if-no-files-found: ignore
