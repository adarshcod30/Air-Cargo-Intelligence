[project]
name = "air-cargo-intelligence"
version = "0.1.0"
description = "Agentic analytics platform for Indian and international air-cargo data"
requires-python = ">=3.11"
# The serving path, and nothing else. Determined by importing the app and
# exercising every route, not by reading imports: FastAPI, SQLAlchemy,
# psycopg, boto3, httpx and dotenv are what actually load.
#
# This list is also the deployment manifest. Vercel's Python builder reads
# pyproject.toml in preference to requirements.txt, so anything the API
# needs must be declared here or the function fails to import - which is
# exactly what happened when fastapi was missing from this list while a
# requirements.txt nobody read declared it correctly.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "httpx>=0.27",
    "boto3>=1.35",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Parsing published cargo tables. Not installed on the serving host: the
# API reads extracted rows and never opens a PDF.
ingest = [
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "duckdb>=1.0",
]
# Forecasting and decomposition. statsmodels and scipy together exceed the
# serverless function size limit, which is affordable only because the
# analytics stage runs offline and the API reads back its rows.
analytics = [
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "numpy>=1.26",
]
migrate = ["alembic>=1.13"]
dev = [
    "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pypdf>=4.0",
    "air-cargo-intelligence[ingest,analytics,migrate]",
]

[project.scripts]
aci-ingest = "services.agents.orchestrator:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    # str+Enum is deliberate: members serialise to plain strings in JSON
    # without a custom encoder, which the provenance ledger relies on.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults, but `Depends(...)` in a
# default IS FastAPI's dependency-injection idiom. Rewriting to satisfy
# the rule would make the routes worse, not safer.
"services/api/*.py" = ["B008"]

[tool.mypy]
# Left unpinned on purpose: pinning 3.11 while running on 3.13 made mypy
# parse the installed numpy stubs under the older grammar and abort
# before checking any of our own code.
ignore_missing_imports = true
exclude = "^(db/migrations|\\.venv)/"
