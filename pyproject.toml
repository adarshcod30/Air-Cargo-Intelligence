[project]
name = "air-cargo-intelligence"
version = "0.1.0"
description = "Agentic analytics platform for Indian and international air-cargo data"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "duckdb>=1.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pypdf>=4.0"]

[project.scripts]
aci-ingest = "services.agents.orchestrator:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    # str+Enum is deliberate: members serialise to plain strings in JSON
    # without a custom encoder, which the provenance ledger relies on.
    "UP042",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
